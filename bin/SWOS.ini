; SWOS — display, audio and gameplay settings.
; Hand-edit freely: SWOS only updates values you change and adds missing
; keys; your comments, blank lines and commented-out keys are preserved.
; Booleans accept true/false, on/off, yes/no, 1/0 (case-insensitive).

[video]
; renderer: software | accel  (hardware-accelerated)
renderer=accel
; vsync: true | false  (accel renderer only)
vsync=false
; subpixel_scroll: true | false. Smooths scrolling by shifting the frame by the camera's sub-pixel remainder. Never blurs. Off = compare
subpixel_scroll=true
; scaling: sharp | smooth. A fullscreen scale is rarely a whole number (1080/272 = 3.97), so a plain nearest copy makes some pixels bigger than others. smooth evens them
scaling=smooth
; crt_mask: off | aperture | slot | scanlines. Synthetic CRT shadow-mask drawn over the finished frame. Costs one full-screen draw however many effects are on
crt_mask=off
; crt_mask_strength: 0-100. How dark the grille's off-phase gets. 0 = invisible, 100 = black between phosphors
crt_mask_strength=45
; crt_vignette: 0-100. Darkens towards the corners like a tube's edges. 0 = off
crt_vignette=0
; crt_corners: 0-100. Rounded-glass corner size. 0 = square screen
crt_corners=0
; render_driver: auto | opengl | direct3d11 | direct3d | software-backend. auto = SDL default (D3D11 on Windows). Use opengl if replays/attract run in slow motion on Windows
render_driver=auto
; fullscreen: off | desktop | exclusive
fullscreen=off
; scale: window scale 1-4 (windowed only)
scale=2
; widescreen: true | false | stretch. true fills the display's shape, showing
; more of the pitch at the sides; false draws the view's own width -- 336 the
; Amiga way, 320 the DOS way -- with bars; stretch draws that same picture
; pulled out to fill the display. It does NOT change the game either way: the
; simulation sees a fixed view, so the extra columns are margin it cannot use.

widescreen=true
; resolution: WxH (e.g. 2560x1080) drives the render ASPECT, or 'auto' for the desktop.
; It is not the render SIZE: the picture is always 272 lines tall and 336..672 wide,
; so a wider shape shows more pitch and a small one (320x200) just clamps to 336x272
resolution=auto
; screen: monitor index to open on, 0 = primary. Auto-clamped if out of range; window size auto-fits that screen
screen=0

; menu_cursor: flashing | steady. The menus' cursor frame (SWOS 2020's flashing menu cursor)
menu_cursor=flashing
; menu_opacity: 0-100 -- the menus' buttons over the backdrop (SWOS 2020's alpha-blended
; menus): 100 solid, less lets the backdrop or the background picture show through them.
; Their text and frames stay solid. Menus only, never a match.
menu_opacity=100
; purple_for_brown: true | false -- every maroon (brown) kit drawn purple, in the menus and
; in a match (the SWOS 2020 launcher's "Purple instead of Brown"). Drawing only.
purple_for_brown=false
; improved_pitch_palette: true | false -- SWOS 2020's: the wet and soft pitches' stripes show
; (their second grass colour a little lighter). Drawing only.
improved_pitch_palette=false
; pixel_filter: none | simple2x | scale2x | scale3x -- SWOS 2020's filters: the picture made 2 or
; 3 times bigger by the filter before it is scaled to the window. The GPU renderer only, and not
; with a RetroArch shader preset (the retrotv mod), which is a filter of its own.
pixel_filter=none
; auto_centering: true | false -- a window resized or moved goes back to the middle of its
; display (SWOS 2020's --auto-centering). Windowed only.
auto_centering=false
; show_fps: true | false -- the frames shown a second, in the window's top right corner.
show_fps=false
[audio]
; mode: mono | stereo
mode=mono
; style: amiga | pc. A match's sounds: the Amiga's, or the PC game's sampled
; effects, crowd and chants (sound_dos/). The menus' music is the Amiga's either
; way. It changes nothing in a match: online, each player hears their own.

style=pc
; music: amiga | pc. The music: the Amiga's, or the PC game's -- the CD
; release's title song in the intro, and menu.xmi on an emulated AdLib card with
; the game's own instruments in the menus.

music=pc
; commentary_dir: a folder of your own commentary, one sub-folder per category
; (goal, own_goal, corner, ... -- docs/DOS_SOUND.md), .wav, .mp3 or .raw files of
; any length. Empty: sound_dos/commentary. A category without files keeps the PC
; game's lines.

commentary_dir=
; menu_music: midi | mp3. With music = pc, the menus' music is the game's
; menu.xmi played live on the emulated card (midi), or a recording of it,
; sound_dos/menu.mp3 (mp3).

menu_music=midi
; commentary: auto | true | false. The PC game's commentary. auto (the
; default): with style = pc only. true: always, over the Amiga's sounds too.

commentary=auto

; title_music: mp3 | midi. With music = pc, the intro plays the CD's title song,
; sound_dos/title.mp3 (mp3), or sound_dos/title.xmi live on the emulated card
; (midi: SWOS 2020's floppy title song, which a mod brings). Without its file, the
; Amiga's.

title_music=mp3
; music_volume, chants_volume, commentary_volume, effects_volume: 0..100 (SWOS 2020's
; AUDIO OPTIONS) -- the menus' music, the crowd chants, the commentary, the ball and
; the whistle (with the Amiga's sounds, its crowd too). In a match Shift+1 / Shift+2
; turn the chants down / up, Shift+3 / 4 the commentary, Shift+5 / 6 the effects.
music_volume=100
chants_volume=100
commentary_volume=100
effects_volume=100
[input]
; stick_deadzone: 5-90. How far an analog stick must be pushed, in percent of
; its travel, before it counts as a direction. Raise it if the stick drifts or
; feels twitchy; lower it for a lighter touch. Past it, the stick gives whichever
; of the eight directions it points nearest to. The D-pad is not affected.
stick_deadzone=25
; latch_presses: true | false. The match reads the fire button once a frame.
; true (the default): a press that was down and up again between two reads
; still counts as pressed for one frame, so a very short tap is never lost.
; false: only what is held at the moment of the read counts, as before.
latch_presses=true
; key_up, key_down, key_left, key_right, key_fire: your own keys, BESIDE the
; built-in ones (the cursor keys; either CTRL or ENTER to fire), which keep
; working. A key's name as SDL writes it: W, A, S, D, Space, Left Shift,
; Right Ctrl, Keypad 8 ... Empty: none. A key named here is a control and
; nothing else: it no longer does what it did in the game (W called the bench,
; S the statistics), except in a text field. Use these rather than an external
; key remapper, which feeds the game key presses of its own timing.
key_up=
key_down=
key_left=
key_right=
key_fire=F

; Career+ THREE BUTTONS: key_pass, key_shoot, key_high_shot. Defaults S, D, A.
; Active in live offline matches only when [gameplay] three_button = true.
; Key names are SDL scancode names. Empty disables that action.
key_pass=X
key_shoot=C
key_high_shot=Z
; touch_controls: auto | always | never -- a phone's on-screen stick and buttons.
; auto (the default): hidden while a game controller is played, back on a touch;
; always: always on screen; never: never (a handheld with controls of its own).
; OPTIONS -> CONTROLS sets it. The desktops have none.
touch_controls=auto
; pad1, pad2: whose controller is whose (OPTIONS -> SETTINGS -> CONTROLS). auto: the
; pads as they come, the first player 1's; keyboard (pad1): no pad, the keyboard alone;
; none (pad2): player 2 has no control; or a pad by its GUID (#2 for the second alike).
pad1=auto
pad2=auto
; auto_detect_pads: true | false. A pad plugged in later goes to a free auto player;
; false: it waits until SELECT JOYPAD gives it to one.
auto_detect_pads=true
; pad_config: CONTROLLER SETUP's, per pad GUID: guid:fire:bench:x+:x-:y+:y- separated by ;
; (a button number, -1 the default; a stick cut-off in percent, 0 = stick_deadzone).
pad_config=
; shoulder_buttons: off | on. Off (DISABLE SHOULDER BUTTONS): the shoulder buttons and
; stick clicks cannot be a pad's FIRE or BENCH.
shoulder_buttons=off
; call_bench: both | taps | button. The PC style's ways to call the bench: the second fire
; button or three taps (both), the taps alone, or the button alone (offline matches; the
; Amiga style has no second button and keeps the taps).
call_bench=both
; mouse_cursor: system | workbench2 | workbench1 -- the mouse pointer: the system's, or
; SWOS 2020's Amiga Workbench 2.04 or 1.x pointer (--mouse-cursor=0|1|2).
mouse_cursor=system
[gameplay]         ; deliberate departures from the original Amiga game
; fire_hold_lockout: true | false — true restores a BUG IN THE ORIGINAL
; AMIGA GAME: an OPPONENT's tackle wipes your held fire button's shot charge,
; and it cannot restart while the button is down, so holding fire through a
; challenge never shoots until you let go and press again. Default false
; (fixed). Your OWN tackle still spends the press either way — that half is
; deliberate in the original. See team_control.c.
fire_hold_lockout=false
; contest_own_ratings: true | false. When two players contest the ball the game
; rolls a dice weighted by tackling and ball control. The ORIGINAL rates one of the
; two sides by a team-mate (the player with the opponent's line-up number), in both
; the Amiga and PC releases. true rates each side by the man actually at the ball.
; Default false: the original. OFFLINE matches only -- an online match always
; plays the original's. See docs/BALL_CONTEST.md.
contest_own_ratings=false
; style: amiga | dos. The Amiga release is the definitive one and what this
; port is reverse engineered from; dos is the PC release's 70 FPS physics,
; timers and formations, and its 320x200 view -- the view is part of how it
; plays (what is on screen decides which players the game picks), so the
; style sets both. Online, the game plays the HOST's style.

style=dos

; improved_ai: true (default) | false (original SWOS AI).
improved_ai=true
; three_button: false (default, classic) | true (A high, S fire, D shoot).
three_button=true
; cpu_tactics: normal | expert -- expert plays SWOS 2020's improved formations (its
; --improved-cpu-tactics: every team's 4-4-2 to DEFEND, named 4132, 5131, ...). Off line only.
cpu_tactics=expert
[replays]
; auto_save: true | false — every match is recorded to LATEST.SRP in the save
; folder and can be watched from HIGHLIGHTS -> LOAD. true also keeps a dated
; copy of each (MMDDHHMM.SRP), so a match is not overwritten by the next one.
auto_save=false

; frame_overlay: true | false — the box at the bottom left of a recording being
; watched (its speed, paused or not, the frame and a bar); I shows or hides it.
; The keys: P pause, Up / Down speed, Left / Right backwards / forwards (paused: a
; frame), Home / End the first / last frame, PgDn / PgUp a tenth back / on.
frame_overlay=true
; speed: normal | half — the speed a recording starts at in the viewer.
speed=normal
[netplay]
; matchmaker: the server MULTIPLAYER logs in to, as "host" or "host:port"
; (default port 19602). Empty means the public server, online.openswos.net. You can type it
; on the login screen instead -- it is saved back here.
matchmaker=
; name: your name on the MULTIPLAYER login screen. Typed there and saved back
; here while REMEMBER LOGIN INFO is on.
name=
; remember_login: true | false -- the login screen's REMEMBER LOGIN INFO switch.
remember_login=true
; record: stream every live match to a recorder, which keeps it and compares the
; two players' frames to catch a desync: "server" (the default: the matchmaker
; above, for the matches it arranges), a recorder of your own as "host" or
; "host:port" (every match), or "off". Empty means the default.
record=server
; reports: true | false -- after an online match, send both players' SWOS.log and
; HOW WAS THE MATCH? to the other player and the server, zipped (a copy is kept in
; save/netplay either way). false: nothing leaves this machine.
reports=false
; balance: true | false -- online, when one player is predicting the other's input two
; frames or more deeper than the other is, that player waits a little. Timing only,
; never the match. It works only when BOTH players have it on
; (docs/NETPLAY_BALANCE.md).

balance=false
; prediction: true | false -- keep what each player SAW of an online match in its
; replay: how many of the other player's inputs were guesses on each frame, the
; rollbacks, and where players were drawn against where they really were. The
; playback page shows it (docs/PLAYBACK.md). A replay plays the same without it.
prediction=true

; live_cast: true | false -- let LIVE CAST's viewers watch your online matches on the
; recorder (false keeps them off its list; recording for desync checks goes on).
live_cast=true
; esc_presses: 1-3. ESC PRESSING TO QUIT: how many ESC presses, each within two seconds,
; leave an online match.
esc_presses=1
[graphics]
; style: amiga | dos | 2020. Which artwork the pitch, HUD and menus are drawn
; from. Gameplay is unaffected -- this is only what it looks like.

style=amiga
; sprites: auto | amiga | jaguar. The Atari Jaguar redrew the players at 256
; colours -- same animations, more shades (docs/JAGUAR.md). auto is the
; built-in default, amiga.

sprites=amiga
; pitch_maps: true | false. With style = dos, draw a pitch from its Tile Agent
; map (grafs_dos/pitch<N>.tmj) where there is one, and from the game's own files
; where there is not (docs/PITCH_MAPS.md). Only the picture: the match itself,
; online and in replays, is the same either way.

pitch_maps=false
; outfit_shading: true | false. Shade the kit into four tones per colour, the
; way the Jaguar art does. false draws each kit colour flat, exactly as the
; 16-colour Amiga game does.

outfit_shading=true
; shadow_shading: true | false. Shade the drop shadow, tinted from the grass of
; the pitch being played on. false uses SWOS's own colour 8 -- one near-black
; that reads on any pitch, and costs the palette nothing.

shadow_shading=true
; hair_shading: true | false. Shade hair the game draws in a single colour (a
; black head), by shade_step like the kit. false draws it flat, exactly as the
; 16-colour Amiga game does. Hair the game shades itself (ginger, blond) is
; the game's own either way.

hair_shading=true
; shade_step: 1..5. How far apart the four kit shades are, in sixteenths:
; 16, 16-N, 16-2N, 16-3N. The Jaguar's own artwork used about 3, which takes
; a near-white sock down to 37.5% and reads as dark grey; 2 keeps it white.
; Hair shading uses it too: black hair's highlight is lifted by 3 x N.

shade_step=2
; kit_art: amiga | jaguar. The shirts, shorts and socks drawn on the UNIFORM
; screen: the Amiga's flat drawings, or the Atari Jaguar's shaded ones (shaded by
; shade_step, like its sprites). That screen only: it changes nothing in a match,
; and does not follow the sprites setting.

kit_art=amiga

; clash_kits: true | false -- SWOS 2020's GK/REF CLASH KITS: when either team wears a dark
; kit (black, blue, burgundy), both keepers change to green (grey if a team wears green)
; and the referee to yellow (light blue if a team wears yellow). Only how they look.
clash_kits=false
[arcade]           ; coin-op mode (PC-only). See docs/ARCADE.md
; enabled: true | false — boot straight to attract mode, no main menu
enabled=false
; mode: arcade game mode (F2 service menu). Currently: GOLDEN GOAL
mode=GOLDEN GOAL
; game rules (F2 service menu). game_seconds 10..600;  golden_goal/penalties_on_draw/goal_replay: true | false
game_seconds=45
golden_goal=true
penalties_on_draw=true
goal_replay=true
; attract_audio: music (HERO only) | sfx (reel crowd only) | music+sfx (both, default)
attract_audio=music+sfx
; gameplay: amiga (50fps feel) | dos (70fps). Picks attract_mode/<mode> reels too
gameplay=amiga
; cabinet key bindings (SDL key names; MAME layout 5/6 = coin P1/P2, 1/2 = start, F2 = service)
key_p1_credit=5
key_p1_start=1
key_p2_credit=6
key_p2_start=2
key_service=F2

[general]
; language: en | de | fr | es | it | nl
language=en
; currency: pound | dollar | euro
currency=pound
; assets_reminder_off: set by "Don't remind me" on the reminder that your game data was made by
; an older OpenSWOS Setup -- the data versions it was about. Empty: remind (src/assets_check.c).
assets_reminder_off=1,1,2,1,1,1,1,1

; --- keys added by a newer SWOS build (defaults; edit as you like) ---
; world: 9697 | 2627 -- the football world: its countries, clubs and competitions
; (docs/WORLD_2026_27.md): SWOS 96/97, or World 2026-27 once OpenSWOS Setup has
; imported its data. A save is played in the world it was made in.
world=2627
; file_sort: name | date -- the order of the LOAD and SAVE screens' files (SWOS 2020's SORT
; OPTION; their SORTED BY button switches it): by name, as the game always had them, or the
; newest first.
file_sort=name
; quick_access: true | false -- SWOS 2020's QUICK ACCESS after a friendly: SAVE HIGHLIGHTS,
; FULL MATCH REPLAYS (the match just played) or CONTINUE.
quick_access=false
; skip_intro: true | false -- straight to the menus, no intro (SWOS 2020's --no-intro;
; GAMEPLAY OPTIONS' SKIP INTRO).
skip_intro=false
; skip_image_reels: true | false -- the intro is its title picture and tune alone, without
; the pictures before and after it (SWOS 2020's --no-image-reels).
skip_image_reels=false
; no_load_pause: true | false -- the stadium screen before a match goes at once instead of
; after its 3 seconds (SWOS 2020's --no-load-pause). Off line only.
no_load_pause=true
[testing]
; no_injuries_cards: true | false -- FOR TESTING A CAREER: nobody is booked, sent off,
; injured or suspended, so VIEW RESULT runs through a season without stopping.
; Offline only: an online match always plays the real rules.
no_injuries_cards=false

; --- keys added by a newer SWOS build (defaults; edit as you like) ---
[chat]
; quick1 .. quick0: in an online match, the keys 1 .. 0 send these lines to the other
; player (TAB types one of your own, F3 hides the chat). Empty: that key sends nothing.
quick1=Good luck, have fun!
quick2=Nice goal!
quick3=Great save!
quick4=Unlucky!
quick5=Sorry!
quick6=Well played!
quick7=Lag...
quick8=One moment please
quick9=Rematch?
quick0=GG
; scale: 0 .. 8, the chat box 1x, 1.5x .. 5x (SWOS 2020's CHAT WINDOW SCALE). In an
; online match Page Up / Page Down change it, and it is kept here.
scale=0
; auto_close: 1 .. 5, the seconds the chat box stays after the newest line, then it
; fades (SWOS 2020's AUTO CLOSE CHATBOX).
auto_close=5
; controller_off: true | false. DISABLE CONTROLLER IN CHAT: while you type a line your
; pad steers nobody.
controller_off=false
[mods]
; enabled: the mods to play with, by their folder's name in the mods folder beside this file,
; in that order: a file two of them have comes from the first, e.g. enabled = classics, hall.
; Empty: none (docs/MODS.md). A downloaded (DLC) mod that is not cosmetic keeps the game off line.
enabled=
; disabled: the game's own (canonical) mods to turn off, by name; they are on by default.
disabled=challenge-collection
[tweaks]
; [tweaks]: small changes to the original's behaviour, each off by default and only off line
; (online, and in the test rigs, the original plays): docs/MODS.md.
; cpu_cards: true | false -- the computer's players are booked and sent off too
; (the original cards only a side a human controls).
cpu_cards=false
; no_teammate_tackles: true | false -- a team-mate leaves your player on the ball alone
; (in the original the nearest team-mate runs onto the ball and can slide or take it off you).
no_teammate_tackles=false
; tackle_controlled_player: true | false -- fire slides the player you control
; (in the original a nearer team-mate may slide instead).
tackle_controlled_player=false
; more_fouls: true | false -- one borderline tackle in 16, from the side, is a foul
; (the original gives a foul only from behind; benefactorr's Career+).
more_fouls=false
; ai_injury_subs: true | false -- the computer replaces an injured player at a stoppage
; (the original's computer never substitutes; benefactorr's Career+).
ai_injury_subs=false
; stronger_goalkeeper_ai: true | false -- SWOS 2020's stronger goalkeeper AI: in the
; gameplay styles with the Amiga's keepers (amiga, amiga60, moon) they reach one step
; further for a shot (dos and xbox keep theirs). Off line only; GAMEPLAY OPTIONS' STRONGER KEEPERS.
stronger_goalkeeper_ai=false
; unlimited_transfers: true | false -- SWOS 2020's UNLIMITED TRANSFERS: in a career,
; BUY PLAYER is not held to the season's transfer quota ("the club is unwilling to
; purchase players"), only to the room left in the career's player pool.
unlimited_transfers=false
; The tweaks below are ON by default (RULES OPTIONS); off line only, like every tweak.
; contest_own_ratings: true | false -- when two players contest the ball, each side is
; rated by the man at it. Both originals rate one side by a team-mate (the player with
; the opponent's line-up number): docs/BALL_CONTEST.md.
contest_own_ratings=false
; league_crash_fixes: true | false -- SWOS 2020's career fixes 1-3: a division sized by the
; teams in its file, and when one grew a longer season and fewer meetings. They change
; nothing in 96/97's own leagues; they guard against a database whose leagues differ.
league_crash_fixes=true
; league_rules_2020: true | false -- SWOS 2020's career fixes 4-7 in 96/97: Greece's season
; from October (its cup September to June), Israel plays each other twice (not three times),
; Italy relegates and promotes 3 (not 4), Scotland plays each other three times (not four).
league_rules_2020=false
; three_points_for_a_win: true | false -- every 96/97 league gives 3 points for a win
; (SWOS 2020's --always-points-per-win-3).
three_points_for_a_win=true
; five_substitutes: true | false -- every 96/97 league and cup: 5 substitutes from a bench
; of 5 (SWOS 2020's, with its 3 points). These four apply to a career started with them:
; a saved career keeps the rules it was started with.
five_substitutes=false

; --- keys added by a newer SWOS build (defaults; edit as you like) ---
[options]
; The OPTIONS screen, as it was left (a loaded career plays its own).
; game_length: 3 | 5 | 7 | 10 (minutes)
game_length=3
; pitch_type: seasonal | random | frozen | muddy | wet | soft | normal | dry | hard
pitch_type=seasonal
; auto_replays, all_teams_equal, auto_save_highlights, menu_music: true | false
auto_replays=true
all_teams_equal=false
auto_save_highlights=true
menu_music=false
